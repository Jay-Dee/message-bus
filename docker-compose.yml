services:
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: local-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft Configurations
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093' # Links to internal map
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      # Dual-Listener Setup: Host vs. Internal UI Container
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      # Single-node Developer Speed Optimization
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - kafka-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: local-kafka-ui
    ports:
      - "8080:8080" # Binds dashboard port locally
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092 # Hits the internal network map
    networks:
      - kafka-network

  messagebus-consumer:
      build:
        context: . # Crucial: Look at root to see src/MessageBus.Contracts
        dockerfile: src/MessageBus.Consumer/Dockerfile
      container_name: messagebus-consumer-app
      environment:
        - KafkaSettings__BootstrapServers=kafka:29092
      depends_on:
        kafka:
          condition: service_healthy
      networks:
        - kafka-network

  messagebus-producer:
      build:
        context: . # Crucial: Look at root to see src/MessageBus.Contracts
        dockerfile: src/MessageBus.Producer/Dockerfile
      container_name: messagebus-producer-app
      ports:
      - "5000:8080" 
      environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - KafkaSettings__BootstrapServers=kafka:29092
      depends_on:
        kafka:
          condition: service_healthy
      networks:
        - kafka-network

networks:
  kafka-network:
    driver: bridge
